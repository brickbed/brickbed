[project]
name = "brickbed"
version = "0.1.0"
description = "Python client for the Brickbed document database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Brickbed", email = "hello@brickbed.dev" }]
keywords = ["brickbed", "database", "document", "object-storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://brickbed.dev"
Repository = "https://github.com/brickbed/brickbed"
Issues = "https://github.com/brickbed/brickbed/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brickbed"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
