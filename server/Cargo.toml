[package]
name = "brickbed-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Object-storage-backed JSON document database server"
license = "MIT"
repository = "https://github.com/brickbed/brickbed"
homepage = "https://brickbed.dev"
readme = "../README.md"

[lints.clippy]
# This style-only lint changed defaults across supported Clippy releases and
# otherwise makes the MSRV job disagree with newer local toolchains.
uninlined_format_args = "allow"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
thiserror = "1"
slatedb = "0.9"
object_store = { version = "0.12", features = ["aws"] }
bytes = "1"
rmp-serde = "1"
unicode-segmentation = "1.13.3"
rust-stemmers = "1.2.0"
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
# rustls rather than native-tls: no OpenSSL in the deploy image.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
